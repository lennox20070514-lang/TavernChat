name: Deploy Static Web (iOS PWA & Web)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/tavern-core/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack & install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Run core tests & typecheck
        run: |
          corepack pnpm test
          corepack pnpm --filter @tavern-chat/core type
          corepack pnpm --filter @tavern-chat/web type

      - name: Build static web bundle
        run: corepack pnpm --filter @tavern-chat/web build

      - name: Prepare static Pages artifacts (.nojekyll & SPA 404 fallback)
        run: |
          touch apps/web/dist/.nojekyll
          cp apps/web/dist/index.html apps/web/dist/404.html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
