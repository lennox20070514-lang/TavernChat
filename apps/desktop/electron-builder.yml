appId: com.tavernchat.desktop
productName: TavernChat
directories:
  output: release
  buildResources: build
asar: true
files:
  - dist/**/*
  - web-dist/**/*
  - build/icon.png
  - build/icon.ico
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: TavernChat-${version}-Setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TavernChat
  installerLanguages:
    - zh_CN
    - en_US
portable:
  artifactName: TavernChat-${version}-Portable-${arch}.${ext}
